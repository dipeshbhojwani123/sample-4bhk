controls.maxPolarAngle = Math.PI / 2 - 0.02; // don't go below ground

function makeRenderer() {
  // some GPUs/drivers reject the default context; try progressively cheaper ones.
  // NO antialias on the canvas: every frame is drawn into the composer's MSAA target, and the
  // canvas only ever receives one full-screen rectangle with no edges to smooth. An antialiased
  // canvas was a second, unused multisampled buffer (~110 MB at 2x).
  // ⚠️ alpha stays at its default. An opaque canvas (alpha: false) lost 152 frames on the way
  // to the screen in a 47 s Safari walk, against 2-8 with it.
  const canvas = document.createElement('canvas');
  const tries = [
    { antialias: false, powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false },
    { antialias: false, failIfMajorPerformanceCaveat: false },
    { failIfMajorPerformanceCaveat: false },
  ];
  for (const attrs of tries) {
    const ctx = canvas.getContext('webgl2', attrs) || canvas.getContext('webgl', attrs)
      || canvas.getContext('experimental-webgl', attrs);
    if (ctx) return new THREE.WebGLRenderer({ canvas, context: ctx, antialias: !!attrs.antialias });
  }
  throw new Error('no-webgl');
}

let renderer;
try {
  renderer = makeRenderer();
} catch (e) {
  loadingEl.style.color = '#fff';
  loadingEl.innerHTML =
    '<b style="font-size:17px">3D can’t start — WebGL is unavailable in this browser.</b>' +
    '<div style="text-align:left;max-width:440px;margin:14px auto 0;line-height:1.6;font-size:14px">' +
    '1. Open <code>chrome://settings/system</code><br>' +
    '2. Turn <b>ON</b> “Use graphics acceleration when available”<br>' +
    '3. Click <b>Relaunch</b>, then reopen this page.<br><br>' +
    'Still stuck? Open <code>chrome://gpu</code> — if WebGL shows “Disabled” or “Software only”, ' +
    'update your graphics driver, or try a different browser (Edge/Firefox).</div>';

// ⚠️ A phone reports devicePixelRatio 3; capping at 1.5 there is the single biggest
// frame-rate lever in this file and costs almost no sharpness at phone screen sizes.

                              : Math.min(Math.max(window.devicePixelRatio, 1.5), 2.5));

// AgX renders darker at a given exposure, so exposure is raised to suit.
// ?tone=neutral: Khronos PBR Neutral (keeps hue + saturation; AgX desaturates), for A/B

// image-based ambient: a WARM INTERIOR environment built in-code so PBR floors reflect warm
// light. Bright warm zenith (HDR >1 = a lit ceiling) -> warm walls -> cool floor.
function makeInteriorEnv() {
  const w = 64, h = 32, data = new Float32Array(w * h * 4);
  const zen = [2.4, 2.2, 1.9], mid = [1.15, 1.06, 0.94], flr = [0.30, 0.32, 0.38];
  for (let y = 0; y < h; y++) {
    const t = y / (h - 1);                       // 0 = up, 1 = down
    const k = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
    const a = t < 0.5 ? zen : mid, b = t < 0.5 ? mid : flr;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      data[i] = a[0] * (1 - k) + b[0] * k;
      data[i + 1] = a[1] * (1 - k) + b[1] * k;
      data[i + 2] = a[2] * (1 - k) + b[2] * k;
      data[i + 3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.needsUpdate = true;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(makeInteriorEnv()).texture;
// Upgrade to the REAL interior HDRI (a CC0 studio light pre-baked to a raw float32
// equirect). Async so it never blocks first paint; keeps the gradient on a 404.
new Promise(r => addEventListener('modelshown', r, { once: true })).then(() => fetch('./vendor/interior_env.bin.txt')).then(r => r.ok ? r.text() : Promise.reject()).then(b64buf).then(buf => {
  const tex = new THREE.DataTexture(new Float32Array(buf), 256, 128, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.needsUpdate = true;
  scene.environment = pmrem.fromEquirectangular(tex).texture;
}).catch(() => {});
scene.environmentIntensity = 0.9;

// ---- QUALITY LEVELS + FPS GOVERNOR. One table decides what a frame costs. A phone starts at
// medium, a desktop at high, and the governor steps DOWN when moving frames miss the display
// rate. `?quality=` pins it outright.
//   pr      pixel ratio (the biggest lever: fragments scale with its square)
//   shadow  sun shadow map size
// ⚠️ MSAA AT EVERY LEVEL, 4 samples, never off (EDGE_AA below). `high` used to drop it at 2x
// and above, as if 2x were supersampling: on a 2x screen it is just native pixels, so every
// window frame, door casing and border was drawn with NO antialiasing at all, a hard pixel
// staircase that crawled as you moved, plus single-pixel sparkles where two edges meet.
const DPR = window.devicePixelRatio || 1;
const EDGE_AA = 4;
const QSET = {
  // A DESKTOP never drops below its native pixels on a 1x screen: on a laptop iGPU the home
  // went soft. A 2x laptop does go to 1.25 at the bottom.
  // Shadows at EVERY level: switching them off recompiles every
  // material (a 3.3 s freeze on an Intel UHD), and frameBudget redraws the map only when
  // something moves, so they cost almost nothing per frame anyway.
  low:    { pr: MOBILE ? 1 : Math.min(DPR, 1.25), shadow: 1024 },
  medium: { pr: Math.min(DPR, 1.5), shadow: 1024 },
  // >= 1.5x native on a 1x screen (supersampled), capped at 2.5 so a 4K panel stays usable
  high:   { pr: Math.min(Math.max(DPR, 1.5), 2.5), shadow: 2048 },
};
const QUALITY = ['low', 'medium', 'high'];
const QPIN = QUALITY.indexOf(PARAMS.get('quality'));
const QSTART = QPIN >= 0 ? QPIN : MOBILE ? 1 : 2;
let quality = QSTART;
const composer = new EffectComposer(renderer,
  new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: EDGE_AA }));

// whole frame rendered into 1.5 px
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
// ⚠️ NO SSAO. SSAOPass reads the camera's near, far and projection ONCE, when it is made, and
// walking changes all three (near 0.1 -> 0.05, a 100 deg lens), so it rebuilt depth from the
// wrong camera: measured with it on against off, it changed NO pixel in any room or from
// outside. It only cost a second draw of the whole home every still frame (~4 ms of an M2's
// GPU) and four screen-sized targets, and a working SSAO is a known source of dark halos
// along exactly the edges this page must keep clean.
composer.addPass(new OutputPass());

// each glass pane is tone-mapped before it blends, which lays a milky veil over the view
// through the windows and loses the lamps' glints in them (pixel A/B, kitchen).

  quality = i;
  const q = QSET[QUALITY[i]];
  renderer.setPixelRatio(q.pr);

    sun.shadow.mapSize.set(q.shadow, q.shadow);
    sun.shadow.map?.dispose();

// where smoothness is felt; (2) step down while moving frames miss the display

// the footprint, so the outward direction runs straight into the wall beside it. The open
// side is a fact about the geometry, so ask the geometry — cast around the compass and take
// the direction that stays clear longest.
// `toward`: only look that way or square to it (from the front door: into the home, never
// back out through the open door at the sky)
function bestOutward(c, eyeY, toward) {

    rc.set(new THREE.Vector3(c.x, eyeY, c.z), dir);

    if (!toward || dir.dot(away) > -0.01)

  const score = (k) => Math.min(k.clear, 25);

  helpEl.addEventListener('click', (e) => { if (e.target.id === 'helpx') { setHelp(false); helpBtn.focus(); } });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && helpEl.style.display === 'block') setHelp(false);
    if (e.key === '?' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) setHelp(helpEl.style.display !== 'block');
  });
}

// ---- SETTINGS (the gear, top right). Furniture: every `fixture:` mesh on or off, remembered
// per browser like the Person toggle. Off, the walker walks where the sofa was.
let furnOn = true;
try { furnOn = localStorage.getItem('fw-furniture') !== '0'; } catch (e) {}
const furnChk = document.getElementById('furnchk');
function applyFurniture() {
  furnChk.checked = furnOn;
  for (const o of meshes) {
    if (FIXTURE_RE.test(o.name || ''))
      o.visible = furnOn && (curLevel === null || !o.userData.lv || o.userData.lv === curLevel);
  }
  for (const l of spots) l.intensity = furnOn ? SPOT_I : 0;
  applyCeilings();                               // the pendants hang from it
  if (walk.on) walk.shell = walkShell();
  renderer.shadowMap.needsUpdate = true;
}
furnChk.addEventListener('change', () => {
  furnOn = furnChk.checked;
  try { localStorage.setItem('fw-furniture', furnOn ? '1' : '0'); } catch (e) {}
  applyFurniture();
});
{
  const setEl = document.getElementById('settings'), setBtn = document.getElementById('setbtn');
  // OrbitControls and the walk look both listen on body: keep the gear's pointer to itself
  for (const el of [setEl, setBtn]) el.addEventListener('pointerdown', (e) => e.stopPropagation());
  const setSettings = (on) => {
    setEl.style.display = on ? 'block' : 'none';
    setBtn.classList.toggle('active', on);
    setBtn.setAttribute('aria-expanded', on);
  };
  setBtn.addEventListener('click', () => setSettings(setEl.style.display !== 'block'));
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && setEl.style.display === 'block') setSettings(false);
  });
}
window.__furniture = () => ({ on: furnOn,
  shown: meshes.filter((o) => FIXTURE_RE.test(o.name || '') && o.visible).length,
  all: meshes.filter((o) => FIXTURE_RE.test(o.name || '')).length,
  hanging: ceilingParts.filter((o) => HANGING_RE.test(o.name || '')).map((o) => [o.name, o.visible]) });

loadModel();
animate();
</script>
